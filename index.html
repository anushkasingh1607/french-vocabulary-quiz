/* =========================================
   GAME VARIABLES
========================================== */

let currentLevel = "";
let currentCategory = "";
let currentQuestion = 0;
let score = 0;
let currentCorrectAnswer = "";
let quizWords = [];


/* =========================================
   START LEVEL
========================================== */

function startLevel(level) {

    currentLevel = level;
    currentCategory = "";

    currentQuestion = 0;
    score = 0;

    document.getElementById("levelScreen").style.display = "none";
    document.getElementById("categoryScreen").style.display = "block";
    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("resultScreen").style.display = "none";

}


/* =========================================
   START CATEGORY
========================================== */

function startCategory(category) {

    currentCategory = category;

    currentQuestion = 0;
    score = 0;

    /*
       If Mixed is selected,
       use all vocabulary from the selected level.
    */

    if (category === "Mixed") {

        quizWords = [...vocabulary[currentLevel]];

    } else {

        quizWords = [...categoryVocabulary[currentLevel][category]];

    }


    /*
       Shuffle the words so the questions
       appear in a random order.
    */

    quizWords.sort(() => Math.random() - 0.5);


    /*
       Show quiz screen.
    */

    document.getElementById("levelScreen").style.display = "none";

    document.getElementById("categoryScreen").style.display = "none";

    document.getElementById("gameScreen").style.display = "block";

    document.getElementById("resultScreen").style.display = "none";


    /*
       Display current level and category.
    */

    document.getElementById("levelDisplay").textContent =
        "Level: " + currentLevel + " • " + category;


    document.getElementById("score").textContent = score;


    /*
       Start first question.
    */

    showQuestion();

}


/* =========================================
   SHOW QUESTION
========================================== */

function showQuestion() {

    /*
       Make sure we don't go outside
       the vocabulary array.
    */

    if (currentQuestion >= quizWords.length) {

        showResults();

        return;

    }


    /*
       Select current word.
    */

    let selectedWord = quizWords[currentQuestion];


    currentCorrectAnswer = selectedWord.meaning;


    /*
       Display French word.
    */

    document.getElementById("word").textContent =
        selectedWord.word;


    /*
       Display question number.
    */

    document.getElementById("questionNumber").textContent =
        currentQuestion + 1;


    /*
       Clear previous feedback.
    */

    document.getElementById("feedback").textContent = "";


    /*
       Update progress bar.
    */

    let progress =
        ((currentQuestion + 1) / 10) * 100;


    document.getElementById("progressFill").style.width =
        progress + "%";


    /*
       Create four answer choices.
    */

    createOptions(
        selectedWord,
        currentCategory === "Mixed"
            ? vocabulary[currentLevel]
            : categoryVocabulary[currentLevel][currentCategory]
    );

}


/* =========================================
   CREATE ANSWER OPTIONS
========================================== */

function createOptions(selectedWord, words) {

    let answers = [];


    /*
       Always include the correct answer.
    */

    answers.push(selectedWord.meaning);


    /*
       Add three different incorrect answers.
    */

    while (answers.length < 4) {

        const randomIndex =
            Math.floor(Math.random() * words.length);


        const randomAnswer =
            words[randomIndex].meaning;


        if (!answers.includes(randomAnswer)) {

            answers.push(randomAnswer);

        }

    }


    /*
       Randomize answer order.
    */

    answers.sort(() => Math.random() - 0.5);


    /*
       Find options container.
    */

    const options =
        document.getElementById("options");


    /*
       Clear old options.
    */

    options.innerHTML = "";


    /*
       Create buttons.
    */

    answers.forEach(function(answer) {

        const button =
            document.createElement("button");


        button.textContent = answer;


        button.className = "option";


        button.onclick = function() {

            checkAnswer(answer, button);

        };


        options.appendChild(button);

    });

}


/* =========================================
   CHECK ANSWER
========================================== */

function checkAnswer(answer, button) {

    /*
       Find all option buttons.
    */

    const buttons =
        document.querySelectorAll(".option");


    /*
       Disable every button so the user
       cannot answer twice.
    */

    buttons.forEach(function(btn) {

        btn.disabled = true;

    });


    /*
       Correct answer.
    */

    if (answer === currentCorrectAnswer) {

        button.classList.add("correct");


        score = score + 1;


        document.getElementById("score").textContent =
            score;


        document.getElementById("feedback").textContent =
            "✅ Correct!";

    }


    /*
       Wrong answer.
    */

    else {

        button.classList.add("wrong");


        document.getElementById("feedback").textContent =
            "❌ Incorrect!";


        /*
           Highlight the correct answer.
        */

        buttons.forEach(function(btn) {

            if (btn.textContent === currentCorrectAnswer) {

                btn.classList.add("correct");

            }

        });

    }


    /*
       Wait one second before
       showing the next question.
    */

    setTimeout(function() {

        currentQuestion = currentQuestion + 1;


        /*
           We want exactly 10 questions.
        */

        if (currentQuestion >= 10) {

            showResults();

        }

        else {

            showQuestion();

        }

    }, 1000);

}


/* =========================================
   SHOW RESULTS
========================================== */

function showResults() {

    /*
       Hide quiz.
    */

    document.getElementById("gameScreen").style.display =
        "none";


    /*
       Show result screen.
    */

    document.getElementById("resultScreen").style.display =
        "block";


    /*
       Display final score.
    */

    document.getElementById("finalScore").textContent =
        score;


    /*
       Performance message.
    */

    let message = "";


    if (score >= 9) {

        message =
            "🌟 Excellent! Your French vocabulary is getting strong!";

    }

    else if (score >= 7) {

        message =
            "🎉 Great job! Keep practicing and you'll improve even more!";

    }

    else if (score >= 5) {

        message =
            "👍 Good effort! A little more practice will help.";

    }

    else {

        message =
            "📚 Keep practicing! You'll get better with every quiz.";

    }


    document.getElementById("resultMessage").textContent =
        message;

}


/* =========================================
   RESTART / CHOOSE LEVEL
========================================== */

function restartQuiz() {

    /*
       Hide all other screens.
    */

    document.getElementById("resultScreen").style.display =
        "none";

    document.getElementById("gameScreen").style.display =
        "none";

    document.getElementById("categoryScreen").style.display =
        "none";


    /*
       Return to level selection.
    */

    document.getElementById("levelScreen").style.display =
        "block";

}
